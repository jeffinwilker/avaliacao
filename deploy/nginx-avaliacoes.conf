# Config de exemplo para Nginx.
# Copie para /etc/nginx/sites-available/avaliacoes
# Depois: sudo ln -s /etc/nginx/sites-available/avaliacoes /etc/nginx/sites-enabled/
# Teste:  sudo nginx -t
# Recarregue: sudo systemctl reload nginx

server {
    listen 80;
    # Troque pelo seu domínio (ex: avaliacoes.sualoja.com.br) ou pelo IP do VPS.
    server_name SEU_DOMINIO_OU_IP;

    # Upload de mídia pode passar de 20MB — deixamos folga.
    client_max_body_size 30M;

    # Timeout maior pro sync de produtos que pode demorar (600 produtos).
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache agressivo pro widget (arquivo raramente muda).
    location /widget/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}

# --- HTTPS ---
# Depois de conseguir um domínio, rode:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d avaliacoes.sualoja.com.br
# O certbot vai ajustar esse arquivo automaticamente pra HTTPS + redirect.
